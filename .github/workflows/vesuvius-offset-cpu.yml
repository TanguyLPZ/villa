name: Vesuvius Offset CPU benchmark

on:
  push:
    branches: [vesuvius-offset-cpu]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vesuvius-offset-cpu-holdout
  cancel-in-progress: true

jobs:
  fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the pinned public Villa dependency image
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/offset-fit"
          docker run --detach --name offset-bench --cpus 4 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/offset-fit:/benchmark" \
            -e GITHUB_STEP_SUMMARY=/benchmark/summary.md \
            -w /workspace/lasagna --entrypoint /bin/sleep \
            ghcr.io/scrollprize/villa/volume-cartographer@sha256:9407753393547c422c9689cb8da6b6f4415cc91ad8fa4d89eb476a3df540d7f8 infinity
      - name: Prepare a managed Python with build headers
        timeout-minutes: 5
        run: |
          docker exec offset-bench bash -euo pipefail -c '
            command -v uv >/dev/null || {
              curl --fail --show-error --silent --location https://astral.sh/uv/install.sh | env UV_UNMANAGED_INSTALL=/usr/local/bin sh
            }
            uv venv --managed-python --python 3.14 /tmp/offset-venv
            /tmp/offset-venv/bin/python -c "import pathlib, sys, sysconfig; header = pathlib.Path(sysconfig.get_path(\"include\")) / \"Python.h\"; print(sys.version, header); assert header.is_file()"
          '
      - name: Install CPU PyTorch and the Python dependencies
        timeout-minutes: 6
        run: |
          docker exec offset-bench bash -euo pipefail -c '
            venv_python=/tmp/offset-venv/bin/python
            uv pip install --python "$venv_python" --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchvision==0.26.0
            uv pip install --python "$venv_python" numpy scipy tifffile imagecodecs opencv-python-headless scikit-image requests pyyaml
          '
      - name: Build the native CPU reader and Lasagna modules
        timeout-minutes: 11
        run: |
          docker exec offset-bench bash -euo pipefail -c '
            export CC=gcc-15 CXX=g++-15 CMAKE_BUILD_PARALLEL_LEVEL=3
            venv_python=/tmp/offset-venv/bin/python
            CMAKE_ARGS=-DVC_READER_ENABLE_CUDA=OFF uv pip install --python "$venv_python" -e /workspace/vc_reader
            uv pip install --python "$venv_python" --no-deps -e /workspace/lasagna
            uv pip freeze --python "$venv_python"
            "$venv_python" -c "import fit, fit_data, torch; print(torch.__version__, torch.cuda.is_available())"
          '
      - name: Compare Offset configurations in both directions
        timeout-minutes: 15
        run: |
          docker exec offset-bench /tmp/offset-venv/bin/python \
            /workspace/validation/offset/run_offset_cpu.py --work /benchmark/data
      - name: Plot a registered CT cross-section through the fitted meshes
        timeout-minutes: 6
        run: |
          docker exec offset-bench uv pip install --python /tmp/offset-venv/bin/python matplotlib
          docker exec offset-bench /tmp/offset-venv/bin/python \
            /workspace/validation/offset/offset_cross_section.py --work /benchmark/data
      - name: Attach the measurements to the run summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/offset-fit/summary.md"; then
            cat "$RUNNER_TEMP/offset-fit/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if docker container inspect offset-bench >/dev/null 2>&1; then
            docker rm --force offset-bench
          fi
