name: Vesuvius sheet repair CPU benchmark

on:
  push:
    branches: [vesuvius-sheet-repair-cpu]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheet-repair-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify public CT metadata and reference meshes
        run: python3 validation/sheet_repair/public_data.py
